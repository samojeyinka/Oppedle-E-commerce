default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE") { "techbase" } %>_development

test:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE") { "techbase" } %>_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE") { "techbase" } %>_production
